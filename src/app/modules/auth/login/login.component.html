<div class="container d-flex justify-content-center align-items-center" style="height: 100vh;">
  <div class="card p-4 shadow" style="width: 350px;">
    <h3 class="text-center mb-3">Login</h3>

    <form [formGroup]="form" (ngSubmit)="submit()">
      
      <input type="email" class="form-control mb-3" placeholder="Email" formControlName="email">

      <input type="password" class="form-control mb-3" placeholder="Password" formControlName="password">

      <button class="btn btn-primary w-100">Login</button>
    </form>

    <p class="text-danger mt-3 text-center">{{ error }}</p>
  </div>
</div>

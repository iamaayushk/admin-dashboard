<div class="d-flex justify-content-between align-items-center mb-3">
  <h3>Products</h3>
  <button class="btn btn-primary" (click)="addProduct()">+ Add Product</button>
</div>

<table class="table table-bordered table-striped shadow-sm">
  <thead class="table-dark">
    <tr>
      <th>Name</th>
      <th>Category</th>
      <th>Price (₹)</th>
      <th>Stock</th>
      <th width="150">Actions</th>
    </tr>
  </thead>

  <tbody>
    <tr *ngFor="let p of products">
      <td>{{ p.name }}</td>
      <td>{{ p.category }}</td>
      <td>{{ p.price }}</td>
      <td>{{ p.stock }}</td>

      <td>
        <button class="btn btn-sm btn-warning me-2" (click)="editProduct(p.id)">
          Edit
        </button>

        <button class="btn btn-sm btn-danger" (click)="deleteProduct(p.id)">
          Delete
        </button>
      </td>
    </tr>
  </tbody>
</table>

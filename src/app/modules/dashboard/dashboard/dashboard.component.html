<h2 class="mb-4">Dashboard Overview</h2>

<div class="row g-4">
  <div class="col-md-3" *ngFor="let s of stats">
    <div class="card text-white bg-{{s.color}} shadow">
      <div class="card-body">
        <h5 class="card-title">{{ s.title }}</h5>
        <h3>{{ s.value }}</h3>
      </div>
    </div>
  </div>
</div>

<hr class="my-4">

<h4>Welcome to your Admin Dashboard</h4>
<p class="text-muted">
  Use the sidebar to navigate to different sections of the panel.
</p>
